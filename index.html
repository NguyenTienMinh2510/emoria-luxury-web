<!doctype html>
<html lang="vi" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo_large.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMORIA | Trang Sức Bạc Công Nghệ S925 - Một Chạm Mở Kí Ức</title>
    <meta name="description" content="Thương hiệu trang sức bạc S925 cao cấp tích hợp vi chip công nghệ NFC. Một chạm mở kí ức - Trọn đời giữ yêu thương." />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Complete suppression of Google Translate banner, toolbar, popups and tooltips -->
    <style>
      .goog-te-banner-frame,
      iframe.goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      iframe.skiptranslate,
      .skiptranslate iframe,
      #goog-gt-tt,
      .goog-te-balloon-frame,
      .goog-tooltip,
      .goog-tooltip:hover,
      .VIpgJd-ZVi9od-ORHb,
      .VIpgJd-ZVi9od-ORHb-OEVmcd,
      .VIpgJd-ZVi9od-ORHb-Oxf9ae,
      .VIpgJd-ZVi9od-aZ2wEe,
      .VIpgJd-ZVi9od-vH1Gmf,
      .VIpgJd-ZVi9od-l4eHX-hSRGPd,
      .VIpgJd-yAWNEb-L7lbkb,
      .VIpgJd-ZVi9od-xl07Ob-lTBxed,
      iframe[id*=":container"],
      iframe[id*=":1.container"],
      iframe[id*=":2.container"],
      iframe[class*="VIpgJd"],
      iframe[src*="translate.google"],
      iframe[src="javascript:''"],
      div.skiptranslate:not(#google_translate_element) {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        height: 0px !important;
        max-height: 0px !important;
        width: 0px !important;
        position: absolute !important;
        top: -99999px !important;
        left: -99999px !important;
        z-index: -99999 !important;
        overflow: hidden !important;
      }
      body {
        top: 0px !important;
        position: static !important;
      }
      html {
        top: 0px !important;
      }
      .goog-text-highlight {
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
      }
    </style>
  </head>
  <body class="bg-dark-900 text-slate-100 selection:bg-slate-300 selection:text-dark-950 font-sans antialiased overflow-x-hidden w-full max-w-[100vw]">
    <div id="root"></div>

    <!-- Google Website Translator Engine (Full Page Translation Coverage) -->
    <div id="google_translate_element" style="display:none !important;" aria-hidden="true"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        try {
          if (window.google && window.google.translate) {
            new window.google.translate.TranslateElement({
              pageLanguage: 'vi',
              includedLanguages: 'en,vi',
              autoDisplay: false
            }, 'google_translate_element');
            window.dispatchEvent(new Event('emoria:translate-ready'));
          }
        } catch (e) {
          /* fail gracefully if offline or in sandbox */
        }
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
